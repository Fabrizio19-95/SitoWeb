<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Regno di Renatino</title>
    <style>
        /* Sfondo elegante sfumato */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            background-attachment: fixed; /* Mantiene lo sfondo fermo mentre scorri */
            color: #333;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Contenitore principale allargato per la griglia */
        .container {
            max-width: 1000px;
            width: 100%;
        }

        /* Testata e descrizioni (centrate) */
        .intro-section {
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        /* Griglia delle foto */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
        }

        /* Stile delle Card */
        .card {
            background: rgba(255, 255, 255, 0.95); /* Leggermente trasparente per far intravedere lo sfondo */
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            
            /* Preparazione per l'animazione di comparsa */
            opacity: 0;
            transform: translateY(40px);
        }

        /* Classe aggiunta dal JavaScript quando la card appare sullo schermo */
        .card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        /* Effetto hover quando passi il mouse (solo dopo che è apparsa) */
        .card.visible:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100%;
            height: 300px; /* Fissa un'altezza uguale per tutte le foto nella griglia */
            object-fit: cover; /* Taglia l'immagine senza deformarla per farla entrare nel riquadro */
            border-radius: 12px;
            margin-bottom: 15px;
        }

        /* Bottoni e Barre delle abilità */
        .btn {
            display: inline-block;
            background-color: #ff6b6b;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .btn:hover {
            background-color: #ee5253;
            transform: scale(1.05);
        }

        ul {
            text-align: left;
            line-height: 1.8;
            font-size: 1.05rem;
        }

            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 10px 0
