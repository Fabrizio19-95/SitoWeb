        /* Sfondo a tema Ketchup e Senape */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffca28 0%, #e53935 100%);
            background-attachment: fixed;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {

            width: 100%;
        }

        /* La lavagna del menù */
        .menu-card {
            background: #fffdf5; /* Bianco panna */
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            border: 4px dashed #e53935; /* Bordo tratteggiato da finto menù di strada */
            animation: popIn 0.6s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }

            border-bottom: 2px dotted #ffca28;
        }

            border-bottom: none;
        }

            font-weight: 900;
        }

            margin: 0;
            color: #555;
            line-height: 1.5;
        }
